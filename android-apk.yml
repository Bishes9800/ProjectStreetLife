name: Build Project StreetLife APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare Godot export templates and settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          mkdir -p build
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/ProjectStreetLife.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectStreetLife-Android-APK
          path: build/ProjectStreetLife.apk
          if-no-files-found: error
