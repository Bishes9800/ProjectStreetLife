
name: Build Project StreetLife APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Godot Android environment
        run: |
          mkdir -p ~/.config/godot
          mkdir -p ~/.local/share/godot/export_templates

          cp /root/.config/godot/editor_settings-4.3.tres \
            ~/.config/godot/editor_settings-4.3.tres

          cp -a /root/.local/share/godot/export_templates/4.3.stable \
            ~/.local/share/godot/export_templates/

          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> ~/.config/godot/editor_settings-4.3.tres

          mkdir -p build

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/ProjectStreetLife.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectStreetLife-Android-APK
          path: build/ProjectStreetLife.apk
          if-no-files-found: error
